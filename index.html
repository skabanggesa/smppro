<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Kehadiran Murid Cloud (Google Sheets)</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background: #0f172a; color: white; margin: 0; text-align: center; }
        #reader { width: 100%; max-width: 500px; margin: auto; background: white; border-radius: 12px; overflow: hidden; }
        .status-box { margin: 20px; padding: 20px; border-radius: 15px; font-size: 1.2rem; font-weight: bold; min-height: 80px; }
        .success { background: #10b981; color: white; animation: pulse 0.5s; }
        .error { background: #ef4444; color: white; }
        .warning { background: #f59e0b; color: white; }
        .waiting { background: #334155; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
        .header { padding: 20px; background: #1e293b; margin-bottom: 0px; border-bottom: 1px solid #334155; }
        .audio-banner { background: #3b82f6; padding: 12px; color: white; font-weight: bold; cursor: pointer; font-size: 0.9rem; border-bottom: 1px solid #1d4ed8; }
        .btn-switch {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.9rem;
            margin: 15px 0;
            transition: background 0.2s;
        }
        .btn-switch:hover { background: #2563eb; }
    </style>
</head>
<body>

<div id="audio-banner" class="audio-banner" onclick="unlockAudio()">
    🔊 KLIK DI SINI SEKALI SEBELUM MULA UNTUK AKTIFKAN BUNYI BEEP SCANNER
</div>

<div class="header">
    <h2 style="margin:0;">SISTEM KEHADIRAN MURID</h2>
    <p style="margin:5px 0 0; opacity:0.7; font-size:0.8rem;">Pengimbas QR Kehadiran (Google Sheets Real-Time)</p>
</div>

<!-- Butang Tukar Kamera -->
<div>
    <button id="btn-switch-cam" class="btn-switch" onclick="switchCamera()">
        🔄 TUKAR KAMERA (DEPAN / BELAKANG)
    </button>
</div>

<div id="reader"></div>

<div id="status" class="status-box waiting">
    Sedang memuatkan pangkalan data Google Sheets...
</div>

<audio id="beep" src="beep.mp3" preload="auto"></audio>

<script>
    // --- KONFIGURASI GOOGLE SHEETS SAGE/SAS WEB APP ---
    const SAGE_URL = "https://script.google.com/macros/s/AKfycbwMcWyfOAkHawx3WjhAWQGjkB9MbbRcFkYTfDmXllz1mGKnUzB9Syi7ppsKPeDhFU2vqA/exec";

    let globalStudents = [];
    let todayLogs = [];
    let senaraiImbasanTerakhir = {}; 
    const TEMPOH_COOLDOWN = 10000;
    let resetStatusTimer;

    // FUNGSI PENYERAGAMAN TARIKH (Format Piawai YYYY-MM-DD)
function getTarikhHariIni() {
    const d = new Date();
    const year = d.getFullYear();
    const month = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${year}-${month}-${day}`;
}

// FUNGSI PENORMALAN TARIKH (Tukar sebarang format dari Sheets ke YYYY-MM-DD)
function normalizeDateStr(dateStr) {
    if (!dateStr) return '';
    let str = String(dateStr).trim();
    if (str.includes('T')) str = str.split('T')[0];
    if (str.includes('/')) {
        const parts = str.split('/');
        if (parts.length === 3) {
            const day = parts[0].padStart(2, '0');
            const month = parts[1].padStart(2, '0');
            const year = parts[2].length === 2 ? '20' + parts[2] : parts[2];
            return `${year}-${month}-${day}`;
        }
    }
    return str;
}

    // API Helper untuk Google Apps Script (Format JSON Mesra CORS)
    async function apiRequest(action, payload = {}) {
        try {
            const bodyData = {
                action: action,
                data: payload
            };

            const response = await fetch(SAGE_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(bodyData)
            });
            return await response.json();
        } catch (error) {
            console.error(`[API Error] Action '${action}':`, error);
            return { status: "error", message: error.message };
        }
    }

    // Memuatkan pangkalan data murid & log semasa dari Google Sheets
    async function syncDataFromSheets() {
        try {
            const response = await fetch(`${SAGE_URL}?action=getAllData`);
            const json = await response.json();

            if (json.status === "success" || json.students || json.pelajar) {
                const rawStudents = json.students || json.pelajar || [];
                const rawLogs = json.logs || [];

                globalStudents = rawStudents.map(s => ({
                    id: String(s.id || s['ID MURID'] || s.ID_PELAJAR || '').trim(),
                    name: String(s.name || s.nama || s.NAMA || '').trim().toUpperCase(),
                    class: String(s.class || s.kelas || s.KELAS || '').trim().toUpperCase()
                })).filter(s => s.id || s.name);

                const hariIni = getTarikhHariIni();
                todayLogs = rawLogs.filter(l => (l.date || l.tarikh || l.TARIKH) === hariIni);

                const statusDiv = document.getElementById('status');
                if (statusDiv.classList.contains('waiting')) {
                    statusDiv.innerHTML = "Sedia untuk imbasan QR kehadiran...";
                }
            }
        } catch (err) {
            console.error("Gagal menyinkronkan data Google Sheets:", err);
        }
    }

    // Aktifkan Audio Browser
    function unlockAudio() {
        const beep = document.getElementById('beep');
        beep.play().then(() => {
            beep.pause();
            beep.currentTime = 0;
            document.getElementById('audio-banner').style.display = 'none';
        }).catch(err => {
            console.error("Gagal mengaktifkan audio:", err);
        });
    }

// Fungsi Utama Apabila QR Berjaya Diimbas (Versi Pantas & Anti-Spam)
    async function onScanSuccess(decodedText) {
        const scannedText = decodedText.trim().toUpperCase();
        const masaSekarang = new Date().getTime();

        // 1. SEMAKAN ANTI-SPAM (COOLDOWN INDIVIDU)
        if (senaraiImbasanTerakhir[scannedText]) {
            const bezaMasa = masaSekarang - senaraiImbasanTerakhir[scannedText];
            if (bezaMasa < TEMPOH_COOLDOWN) {
                // Abaikan imbasan diam-diam (tiada beep, tiada loading) supaya tak kacau murid lain
                return; 
            }
        }

        // Kemaskini memori rekod imbasan terkini untuk individu ini
        senaraiImbasanTerakhir[scannedText] = masaSekarang;

        // 2. BUNYI BEEP
        try {
            const beepSound = document.getElementById('beep');
            beepSound.currentTime = 0;
            beepSound.play();
        } catch(e) {
            console.log("Audio disekat browser.");
        }

        const statusDiv = document.getElementById('status');

        // Bersihkan timer status UI sebelum ini (supaya paparan tidak ter'reset' tiba-tiba)
        if (resetStatusTimer) clearTimeout(resetStatusTimer);

        try {
            // Cari murid dalam memori
            const student = globalStudents.find(s => 
                s.id.toUpperCase() === scannedText || s.name.toUpperCase() === scannedText
            );

            if (student) {
                const hariIni = getTarikhHariIni(); // Format Standard DD/MM/YYYY
                const masaIni = new Date().toLocaleTimeString('ms-MY', { hour12: false });

                // Semak jika sudah imbas hari ini
                const sudahHadir = todayLogs.some(l => 
                    (l.id && l.id === student.id) || (l.name && l.name.toUpperCase() === student.name.toUpperCase())
                );

                if (sudahHadir) {
                    statusDiv.innerHTML = `⚠️ SUDAH HADIR!<br>${student.name}<br>Kehadiran murid ini telah direkodkan hari ini.`;
                    statusDiv.className = "status-box warning";
                    
                    resetStatusTimer = setTimeout(() => { 
                        statusDiv.className = "status-box waiting"; 
                        statusDiv.innerHTML = "Sedia untuk imbasan QR kehadiran...";
                    }, 4000);
                    return;
                }

                statusDiv.innerHTML = `⏳ MENYIMPAN...<br>${student.name}<br>Hantar ke Google Sheets...`;
                statusDiv.className = "status-box waiting";

                // Hantar rekod ke Google Sheets melalui API
                const res = await apiRequest("addLog", {
                    id: student.id,
                    name: student.name,
                    class: student.class,
                    date: hariIni,
                    time: masaIni,
                    status: "HADIR"
                });

                // SEMAK BALASAN GOOGLE SHEETS DAHULU SEBELUM TUKAR KE HIJAU
                if (res && res.status === "success") {
                    todayLogs.push({ id: student.id, name: student.name, class: student.class, date: hariIni });
                    statusDiv.innerHTML = `✅ KEHADIRAN DIREKOD!<br>${student.name}<br>(${student.class})`;
                    statusDiv.className = "status-box success";
                } else {
                    statusDiv.innerHTML = `❌ GAGAL SIMPAN!<br>${res.message || "Ralat pelayan Google Sheets"}`;
                    statusDiv.className = "status-box error";
                }

                resetStatusTimer = setTimeout(() => { 
                    statusDiv.className = "status-box waiting"; 
                    statusDiv.innerHTML = "Sedia untuk imbasan QR kehadiran...";
                }, 3000);

            } else {
                // Murid tidak dijumpai dalam Google Sheets
                statusDiv.innerHTML = `❌ GAGAL DETECT!<br>Data (${scannedText}) tiada dalam Google Sheets.`;
                statusDiv.className = "status-box error";
                
                resetStatusTimer = setTimeout(() => { 
                    statusDiv.className = "status-box waiting"; 
                    statusDiv.innerHTML = "Sedia untuk imbasan QR kehadiran...";
                }, 4000);
            }
        } catch (err) {
            console.error("Ralat Pengimbas:", err);
            statusDiv.innerHTML = `❌ REKOD GAGAL!<br>${err.message}`;
            statusDiv.className = "status-box error";
            
            resetStatusTimer = setTimeout(() => { 
                statusDiv.className = "status-box waiting"; 
                statusDiv.innerHTML = "Sedia untuk imbasan QR kehadiran...";
            }, 5000);
        }
    }
    
    // --- PENGURUSAN KAMERA ---
    let currentFacingMode = "user"; // Depan
    const html5QrCode = new Html5Qrcode("reader");
    const config = { fps: 10, qrbox: { width: 250, height: 250 } };

    function mulaKamera(facingMode) {
        if (html5QrCode.isScanning) {
            html5QrCode.stop().then(() => {
                lancarkan(facingMode);
            }).catch(err => {
                console.error("Gagal menghentikan kamera:", err);
                lancarkan(facingMode);
            });
        } else {
            lancarkan(facingMode);
        }
    }

    function lancarkan(facingMode) {
        html5QrCode.start(
            { facingMode: facingMode }, 
            config, 
            onScanSuccess
        ).catch((err) => {
            console.error("Gagal memulakan kamera:", err);
            const statusDiv = document.getElementById('status');
            statusDiv.innerHTML = "❌ GAGAL BUKA KAMERA<br>Sila benarkan akses kamera & pastikan pautan HTTPS.";
            statusDiv.className = "status-box error";
        });
    }

    function switchCamera() {
        currentFacingMode = (currentFacingMode === "user") ? "environment" : "user";
        mulaKamera(currentFacingMode);
    }

    // Mulakan Muat Data & Kamera
    syncDataFromSheets();
    setInterval(syncDataFromSheets, 30000); // Polling data murid baharu setiap 30 saat
    mulaKamera(currentFacingMode);
</script>
</body>
</html>
